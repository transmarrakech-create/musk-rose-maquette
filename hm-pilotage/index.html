function b64(s){var b=atob(s),a=new Uint8Array(b.length);for(var i=0;i<b.length;i++)a[i]=b.charCodeAt(i);return a;}
document.getElementById('f').addEventListener('submit', async function (ev) {
  ev.preventDefault();
  try {
    var base = await crypto.subtle.importKey('raw', new TextEncoder().encode(document.getElementById('pw').value), 'PBKDF2', false, ['deriveKey']);
    var k = await crypto.subtle.deriveKey({name:'PBKDF2', salt:b64(ENC.salt), iterations:ENC.it, hash:'SHA-256'}, base, {name:'AES-GCM', length:256}, false, ['decrypt']);
    var pt = await crypto.subtle.decrypt({name:'AES-GCM', iv:b64(ENC.iv)}, k, b64(ENC.ct));
    var html = new TextDecoder().decode(pt);
    document.open(); document.write(html); document.close();
  } catch (x) { document.getElementById('e').textContent = 'Mot de passe incorrect.'; }
});
